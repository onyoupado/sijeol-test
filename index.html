<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그 시절, 나는 누구였을까</title>
<meta name="description" content="1910–1945, 실제 기록에 남은 장면 앞에서 고르다 보면 일제강점기를 산 사람들 36가지 얼굴 가운데 하나가 나와요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyoupado.github.io/sijeol-test/">
<meta property="og:title" content="그 시절, 나는 누구였을까">
<meta property="og:description" content="독립운동가부터 밀정까지, 일제강점기 36가지 인물 유형 테스트">

<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 레이아웃: 밤의 경성(짙은 청회색) 위에 바랜 마분지 기록카드 한 장. 한 화면에 한 문항. */
:root{
  --night:#1c2430; --night2:#253041; --paper:#ddcca4; --paper-ink:#2a2620;
  --ink:#e9e0cb; --dim:#9aa3ad; --seal:#b3332b; --line:#3a475a;
  --disp:"Noto Serif KR","Nanum Myeongjo",serif; --body:"Gowun Batang","Noto Serif KR",serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;padding:24px 16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1.25;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--dim)}
p{margin:0}
.lead{color:var(--ink);opacity:.9}
.card{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim)}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);background:var(--night2);color:var(--ink);border-radius:3px}
button{font:inherit;cursor:pointer;border-radius:3px}
.btn{background:var(--seal);color:#fff6ee;border:0;padding:14px 18px;font-size:17px;font-weight:700;font-family:var(--disp)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-family:var(--body);font-weight:400;font-size:15px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.meta{font-size:13px;color:var(--dim)}
/* 문항 */
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--seal);transition:width .25s}
.q .yr{font-family:var(--disp);font-weight:900;color:var(--seal);font-size:15px;letter-spacing:.05em}
.q h2{font-family:var(--disp);font-weight:500;font-size:21px;line-height:1.5;margin:6px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--night2);color:var(--ink);border:1px solid var(--line);padding:14px 16px;font-size:16px;line-height:1.5}
.opt:hover{border-color:var(--paper)}
/* 결과 */
.res img{width:100%;max-width:100%;border-radius:4px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 150px}
.axes{display:flex;flex-direction:column;gap:8px;font-size:14px}
.ax{display:grid;grid-template-columns:56px 1fr 40px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.ax b{font-weight:700}.ax span{height:8px;background:var(--line);position:relative}.ax span i{position:absolute;inset:0 auto 0 0;background:var(--paper)}
.ax.r span i{background:var(--seal)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-family:var(--disp);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px;font-size:13px}
.grid div{background:var(--night2);padding:8px 10px;border-left:3px solid var(--line);min-width:0}
.grid .R{border-color:var(--seal)}.grid .M{border-color:var(--dim)}.grid .C{border-color:#5b5f66}
.grid em{font-style:normal;color:var(--dim);display:block;font-size:12px}
.grid .me{outline:1px solid var(--paper)}
.note{font-size:13px;color:var(--dim);line-height:1.6}
.hero{width:100%;max-width:100%;height:auto;display:block;border-radius:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:var(--night2);padding:12px 14px;border-top:3px solid var(--dim);min-width:0;font-size:14px}
.pair div.foe{border-color:var(--seal)}
.pair b{display:block;font-family:var(--disp);font-size:17px;margin:2px 0 4px}
.pair em{font-style:normal;color:var(--dim);font-size:12px;letter-spacing:.08em}
h3{font-family:var(--disp);font-weight:500;font-size:18px;margin:0}
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-left:2px solid var(--line)}
ol.path li{position:relative;padding:0 0 12px 16px;font-size:15px}
ol.path li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--night);border:2px solid var(--paper)}
ol.path li:last-child::before{background:var(--seal);border-color:var(--seal)}
ol.path span{display:block;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.toast{font-size:14px;color:var(--paper);min-height:1.4em}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<script>
const ST={R:'저항',M:'경계',C:'협력'},MO={A:'몸으로',W:'글·예술로',F:'돈·물자로',S:'정보·조직으로'},AR={D:'조선 안',O:'국경 너머',I:'제도 안'};
const STAMP={R:'要視察',M:'無名氏',C:'反民族'};
// [코드, 한자, 이름, 설명, 기록]
const T=[
['RAD','彈','경성의 의열단원','말보다 행동이 빠르다. 경찰서 앞에서도 망설이지 않고, 쫓기면서도 끝까지 맞선다.','1923년 1월 김상옥, 종로경찰서 투탄 뒤 서울 시내에서 일본 경찰과 총격전'],
['RAO','軍','만주의 독립군','고향을 떠나 총을 들었다. 지형을 읽고 때를 기다리는 인내가 있다.','1920년 6월 봉오동 전투, 10월 청산리 전투'],
['RAI','學','동맹휴학 주동 학생','교실 안의 차별을 참지 못한다. 친구들을 모아 교문 밖으로 나간다.','1929년 11월 광주학생항일운동, 전국 학교로 번진 시위'],
['RWD','詩','골방의 저항 시인','총 대신 문장을 벼린다. 잡혀가도 시를 놓지 않는다.','이육사, 1944년 1월 베이징의 일본 영사관 감옥에서 순국'],
['RWO','報','상하이 독립신문 기자','바다 건너에서 진실을 찍어 보낸다. 몰래 들어간 신문 한 장이 누군가를 일으킨다고 믿는다.','1919년 8월 상하이에서 창간된 임시정부 기관지 『독립신문』'],
['RWI','消','일장기를 지운 편집자','안정된 자리를 걸고 사진 한 장을 고친다. 정간이 와도 후회하지 않는다.','1936년 8월 손기정 사진 일장기 말소, 동아일보 무기 정간'],
['RFD','運','독립자금 운반책','장사꾼의 얼굴로 돈을 나른다. 장부는 두 권, 입은 하나다.','안희제의 부산 백산상회(1914), 1919년 백산무역주식회사로 키워 임시정부 자금을 댔다'],
['RFO','援','하와이의 독립 후원자','먼 땅에서 번 품삯을 고국으로 보낸다. 직접 싸우지 못해도 돈줄은 끊기지 않게 한다.','미주·하와이 한인들, 대한인국민회 등을 통해 독립의연금 모금'],
['RFI','産','물산장려운동 상인','사고파는 일로 맞선다. 조선 무명을 진열장 맨 앞에 둔다.','1920년 평양, 1923년 1월 서울에서 조선물산장려회 창립, 토산품 애용 운동'],
['RSD','通','연통제 비밀 연락원','낮에는 평범한 이웃, 밤에는 임시정부 문서를 전한다. 아는 것을 묻어 두는 법을 안다.','1919년 임시정부 연통제·교통국, 국내와 상하이를 잇던 비밀 행정망'],
['RSO','交','임시정부 외교관','세계를 설득하는 쪽을 택한다. 여러 언어로 조선의 사정을 알린다.','1919년 김규식, 파리강화회의에 독립 청원서를 냈으나 정식 회의 참석은 막혔다'],
['RSI','合','신간회 조직가','생각이 다른 사람들을 한자리에 모은다. 합법의 틀을 빌려 전국에 지회를 세운다.','1927년 좌우 합작 단체 신간회 창립, 1931년 해소'],
['MAD','聲','장터의 만세꾼','평소엔 조용히 살지만 그날만은 목청을 높였다. 이름은 남지 않아도 함성은 남았다.','1919년 3·1운동, 장날에 맞춰 전국 장터에서 만세 시위가 이어졌다'],
['MAO','耕','간도의 개척 농민','살길을 찾아 국경을 넘었다. 언 땅을 갈고 학교와 마을을 세운다.','1910~30년대 많은 조선인이 간도·만주로 옮겨 가 농사를 지었다'],
['MAI','避','징용을 피한 청년','끌려가지 않으려고 산으로 숨는다. 맞서지도 따르지도 않고 살아남는 쪽을 고른다.','전쟁 말기 징용·징병을 피해 몸을 숨긴 사람이 많았다'],
['MWD','歌','유성기 시대의 가수','사람들의 설움을 노래로 달랜다. 무대는 어디든 서지만 마음은 고향에 있다.','1935년 이난영 「목포의 눈물」, 유성기 음반으로 크게 유행'],
['MWO','留','도쿄 유학생','새 학문과 새 옷에 끌린다. 모던한 거리에서 조선의 앞날을 고민한다.','1919년 2월 8일 도쿄 유학생들이 3·1운동보다 먼저 독립선언서를 발표'],
['MWI','削','검열 속 신문기자','쓰고 싶은 말의 절반은 지워진다. 그래도 행간에 남길 수 있는 만큼 남긴다.','총독부 검열로 기사가 깎였고, 1940년 8월 조선·동아일보 강제 폐간'],
['MFD','布','종로 포목상','장부와 손님 사이에서 하루를 산다. 북촌 상권을 지키는 게 내 몫이다.','조선인 상권 종로(북촌)와 일본인 상권 혼마치(남촌)가 갈라져 있었다'],
['MFO','橋','국경의 보따리상','압록강을 오가며 물건과 소문을 나른다. 어느 편이든 장사는 계속된다.','1911년 11월 압록강 철교 준공, 신의주와 안둥(지금의 단둥)을 이었다'],
['MFI','簿','생계형 면서기','식구를 먹여 살리려 관청 책상에 앉았다. 시키는 일은 하지만 마음은 편하지 않다.','면 단위 말단 행정 실무는 조선인 서기들이 많이 맡았다'],
['MSD','茶','경성 다방 주인','문인, 학생, 형사까지 한 탁자 건너에 앉는다. 많이 듣고 적게 말한다.','1933년 시인 이상이 종로에 다방 「제비」를 열었다'],
['MSO','譯','경계의 통역사','여러 나라 말을 한다. 말을 옮기다 보면 어느 쪽의 비밀도 손에 쥐게 된다.','만주에서는 조선인이 일본어·중국어 통역을 맡는 일이 잦았다'],
['MSI','名','창씨개명을 미룬 사람','버틸 수 있는 데까지 버틴다. 큰소리는 내지 않지만 이름만은 쉽게 내주지 않는다.','1940년 창씨개명 시행, 신고 기한 6개월 동안 약 80%가 신고했다'],
['CAD','刑','고등계 형사','같은 말을 쓰는 사람을 쫓는다. 출세를 위해 동포를 취조실로 데려간다. 일제 앞잡이의 전형.','1949년 반민특위가 고문 경찰들을 체포했으나 상당수가 풀려났다'],
['CAO','討','간도특설대원','만주국 제복을 입고 항일 부대를 쫓는다.','1938년 만주국 간도특설대 창설, 조선인 중심으로 항일 무장세력 토벌'],
['CAI','憲','헌병보조원','일본 헌병 곁에서 길을 안내하고 마을을 단속한다.','1908년 헌병보조원 제도, 의병 진압과 무단통치의 손발이 되었다'],
['CWD','畵','친일 예술가','재능을 전쟁 선전에 쓴다. 붓과 무대는 화려하지만 내용은 총독부의 것이다.','전쟁 말기 「결전미술전」·「반도총후미술전」 등 전쟁을 미화하는 전람회가 열렸다'],
['CWO','慰','황군 위문단 연예인','전선까지 가서 일본군을 위해 노래하고 춤춘다.','중일전쟁 뒤 조선 연예인들이 중국 전선 위문 공연에 나섰다'],
['CWI','勸','학병 권유 연사','이름난 지식인으로서 청년들에게 전쟁터로 가라고 연설한다.','1943년 학병제 시행, 여러 문인·교육자가 권유 강연과 기고에 나섰다'],
['CFD','獻','비행기 헌납 부호','재산으로 충성을 증명한다. 국방헌금과 비행기 헌납으로 신문에 이름을 올린다.','중일전쟁 뒤 국방헌금과 비행기 헌납 운동이 벌어졌다'],
['CFO','納','만주 군납업자','전쟁이 곧 대목이다. 일본군에 물자를 대고 큰돈을 번다.','1932년 만주국 수립 뒤 군수 납품으로 부를 쌓은 조선인 사업가도 있었다'],
['CFI','租','동척 마름','일본 회사의 땅을 관리하며 소작인에게 높은 소작료를 거둔다.','1908년 동양척식주식회사 설립, 조선 농민의 땅과 소작료를 장악했다'],
['CSD','班','감시하는 애국반장','이웃 열 집 사정을 꿰고, 공출과 동원을 앞장서 챙긴다.','1938년 국민정신총동원 조선연맹, 10호 안팎 단위로 애국반 조직'],
['CSO','諜','상하이의 밀정','동지인 척 다가가 정보를 넘긴다. 독립운동가들이 가장 경계한 얼굴이다.','『백범일지』 등에 상하이 독립운동 조직에 숨어든 밀정 이야기가 남아 있다'],
['CSI','參','중추원 참의','총독부 자문 기구에 앉아 식민 통치에 이름을 빌려준다. 친일 부역자의 상층부.','조선총독부 중추원, 친일 조선인 유력자들이 참의로 임명되었다']
];
// 문항: [연도, 상황, [[선택지, 점수코드]...]]  점수코드: 입장 R/M/C · 수단 A/W/F/S · 무대 D/O/I
// 제1부(공통 5문항)로 입장을 가르고, 제2부는 입장별 5문항, 마지막은 가장 가까운 두 유형 사이의 갈림길.

function tally(n){
  const s={};
  hist.slice(0,n).forEach((h,i)=>{for(const ch of h.q[2][h.i][1])s[ch]=(s[ch]||0)+1+i*0.01});
  return s;
}
const pick=(s,k)=>k.split('').reduce((b,c)=>(s[c]||0)>(s[b]||0)?c:b);
const stance=()=>pick(tally(COMMON.length),'RMC');
function ranked(s){return T.map(t=>[t,(s[t[0][0]]||0)*1.5+(s[t[0][1]]||0)+(s[t[0][2]]||0)]).sort((a,b)=>b[1]-a[1])}

function getQ(i){
  if(i<COMMON.length)return COMMON[i];
  if(i<TOTAL-1)return BR[stance()][i-COMMON.length];
  if(!finalQ){
    const r=ranked(tally(TOTAL-1)).slice(0,2).map(x=>x[0]);
    if(Math.random()<.5)r.reverse();
    finalQ=['마지막 갈림길','두 갈래 길이 남았다. 어느 쪽이 더 나에 가까운가?',r.map(t=>[t[3],'T'+t[0]])];
  }
  return finalQ;
}

  app.innerHTML=`<div class="prog"><span>${part}</span><span>${qi+1} / ${TOTAL}</span></div>
  <div class="bar"><i style="width:${qi/TOTAL*100}%"></i></div>
  <div class="q">${yr&&qi<TOTAL-1?`<div class="yr">${yr}</div>`:''}<h2>${esc(txt)}</h2></div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>
  ${qi?'<button class="btn ghost" id="back">이전 문항</button>':''}`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    hist[qi]={q,i:+b.dataset.i};hist.length=qi+1;finalQ=qi==TOTAL-1?finalQ:null;qi++;

  window.scrollTo(0,0);
}

function wrap(c,text,x,y,maxW,lh,maxLines){
  const lines=split(c,text,maxW);
  lines.slice(0,maxLines).forEach((l,i)=>c.fillText(l,x,y+i*lh));
  return y+Math.min(lines.length,maxLines)*lh;
}
function split(c,text,maxW){
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){
    const test=line?line+' '+w:w;
    if(c.measureText(test).width<=maxW){line=test;continue}
    if(line)lines.push(line);
    if(c.measureText(w).width>maxW){let part='';for(const ch of w){if(c.measureText(part+ch).width>maxW){lines.push(part);part=ch}else part+=ch}line=part}else line=w;
  }
  if(line)lines.push(line);
  return lines;
}

function cols(){const css=getComputedStyle(document.documentElement),v=k=>css.getPropertyValue(k).trim();

function scene(c,x,y,w,h,code,k){
  const mo=code[1],ar=code[2],g=y+h*.74;
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
